[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ar-tokenwise"
version = "0.1.0"
description = "Lightweight, conservative Arabic text normalization and token-usage reporting for LLM API calls."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [
    { name = "Abdallah" }
]
keywords = ["arabic", "nlp", "tokenization", "llm", "normalization"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Natural Language :: Arabic",
]

# No runtime dependencies for v1 core (normalize.py uses stdlib only).
dependencies = []

[project.optional-dependencies]
# Only needed if the user wants real tokenizer-based fertility reports (v1 report.py).
# Kept optional so core normalization stays dependency-free.
tokenizers = ["tiktoken>=0.7"]
# Only needed for integrations/litellm_plugin.py,
# integrations/langchain_wrapper.py, and integrations/llamaindex_wrapper.py
# -- not required for the core library, and not installed as part of the
# package itself (all integration files live outside src/, see the
# integrations/ directory). Bundled as one extra rather than split
# per-integration: all three dependencies are lightweight (langchain-core
# and llama-index-core are core abstractions, not the full packages with
# model-provider extras) and the project has few enough integrations so
# far that per-integration extras would add naming complexity without
# real benefit yet.
integrations = ["litellm>=1.40", "langchain-core>=0.3", "llama-index-core>=0.11"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "anyio>=4.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/ar_tokenwise"]
# Ensure the PEP 561 marker ships inside the built wheel.
include = ["src/ar_tokenwise/py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]